# Gateway tools
"gateway::provision":
  snippet: |
    # Provisioning reports failure in its result; poll provision_status with job_id
    out = mcp.call_tool("gateway.provision", {"server_name": "github"})
    if not out["ok"]:
        print(f"Provision failed: {out['message']}")

"gateway::provision_status":
  snippet: |
    import time
    job = mcp.call_tool("gateway.provision", {"server_name": "github"}).get("job_id")  # None: no job to wait for
    while job and (st := mcp.call_tool("gateway.provision_status", {"job_id": job})["status"]) in ("pending", "installing"): time.sleep(1)
    print("provision:", st if job else "finished without a job (see gateway.provision's status)")

"gateway::catalog_search":
  snippet: |
    # Search and filter
    search = mcp.call_tool("gateway.catalog_search", {"query": "browser"})
    online_tools = [r for r in search["results"] if r["availability"] == "online"]
    cli_hints = search.get("cli_hints", [])

"gateway::describe":
  snippet: |
    # Warn on the gateway's safety notes or a destructive hint before invoking
    card = mcp.call_tool("gateway.describe", {"tool_id": "server::tool"})
    if card.get("safety_notes") or (card.get("annotations") or {}).get("destructiveHint"):
        print("Warning:", card.get("safety_notes") or "destructive tool")

"gateway::invoke":
  snippet: |
    # Gateway failures are ok: false (a tool's own failure is ok: true + result.isError)
    out = mcp.call_tool("gateway.invoke", {"tool_id": "server::tool", "arguments": args})
    if not out["ok"]:
        print(f"Invocation failed: {out['errors']}")

# Context7 examples
"context7::query-docs":
  snippet: |
    # Query docs for libraries (resolve each ID first with context7::resolve-library-id)
    libraries = ["/facebook/react", "/vuejs/core"]
    for lib in libraries:
        docs = mcp.call_tool("gateway.invoke", {"tool_id": "context7::query-docs", "arguments": {"libraryId": lib, "query": "hooks"}})

# Generic fallback template (used when no specific template exists)
_generic_fallback:
  snippet: |
    # Example usage
    result = mcp.call_tool("gateway.invoke", {"tool_id": "{tool_id}", "arguments": {args}})
    print(result)
