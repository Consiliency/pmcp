[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmcp"
version = "2.7.3"
description = "PMCP - Progressive MCP: Minimal context bloat with on-demand tool discovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ViperJuice", email = "viperjuice@users.noreply.github.com" }
]
keywords = ["mcp", "claude", "progressive", "disclosure", "anthropic", "llm", "ai"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]
dependencies = [
    # Version ordering for update notices. Hand-rolled digit extraction
    # fabricated "update available" notices for any non-numeric version
    # (`nightly`, `build-1`, and the empty string the MCP SDK defaults to);
    # packaging implements PEP 440 ordering and rejects non-versions outright.
    # Pure-Python, no transitive deps, already ubiquitous in the ecosystem.
    "packaging>=22",
    # SemVer 2.0.0 precedence for the npm/Cargo lane. PEP 440 and SemVer
    # genuinely disagree -- PEP 440 reads `1.0.0-1` as the POST-release
    # `1.0.0.post1`, SemVer as a PRERELEASE below `1.0.0` -- and 79 of the
    # manifest's 107 servers are npm, so that inversion was live. This replaced
    # a hand-written key (Consiliency/pmcp#156): hand-rolled version logic in
    # this module produced a fabricated-notice bug in every form it took.
    # Pure-Python, no transitive dependencies.
    "semver>=3,<4",
    # Upper bound is load-bearing: 3.0.0 is unreleased and unaudited. pmcp's
    # P2 phase ported the gateway's upstream handlers and downstream
    # transport onto mcp 2.0.0's rewritten low-level Server (typed on_*
    # callbacks replace the removed decorators) and Streamable HTTP client
    # (streamable_http_client replaces streamablehttp_client, and owns a
    # caller-supplied httpx2.AsyncClient rather than building its own). A
    # future 3.x may reshape either surface again; raising this cap requires
    # re-auditing both the way P2 did for 2.x, not just relaxing the pin.
    #
    # The lower bound is load-bearing too: 2.0.0 is the first mcp release
    # with all three symbols pmcp now imports directly — the low-level
    # Server's on_* constructor kwargs (server.py), streamable_http_client
    # (client/manager.py), and the server/discover handler + the
    # 2026-07-28 modern-era envelope (mcp_types.version) — and it is also
    # simply the oldest stable 2.x release; there is no 2.0.0-rc or 1.x
    # release that has these. Below 2.0.0, client/manager.py's module-scope
    # `from mcp.client.streamable_http import streamable_http_client`
    # raises ImportError (that name doesn't exist before 2.0.0) and the
    # gateway dies on startup. The min-version-smoke CI job re-proves this
    # floor on every run, including a real downstream tool call through a
    # booted gateway.
    "mcp>=2.0.0,<3.0.0",
    # httpx (distinct from httpx2 below) is for cli.py's two diagnostics
    # probes (_probe_sse_endpoint, _probe_http_health), which do a bare
    # `import httpx`. Through mcp 1.x this rode in transitively via mcp's
    # own httpx dependency; mcp 2.0.0 depends on httpx2 instead and declares
    # no httpx at all, so an undeclared `import httpx` would now be a
    # ModuleNotFoundError on a clean install. Declared directly rather than
    # left transitive, per this repo's standing rule against undeclared
    # transitive imports (it has shipped broken twice riding one).
    "httpx>=0.27,<1.0",
    # httpx2 (distinct from httpx above) is for client/manager.py's
    # downstream Streamable HTTP transport: streamable_http_client requires
    # a caller-supplied httpx2.AsyncClient (mcp 2.0.0 no longer builds and
    # owns its own), and pmcp constructs one explicitly with
    # follow_redirects=True to match 1.x's create_mcp_http_client default,
    # since httpx2.AsyncClient's own default is False. The floor matches
    # mcp 2.0.0's own `Requires-Dist: httpx2>=2.5.0`.
    "httpx2>=2.5.0,<3.0.0",
    # jsonschema is for server.py's restored tool input-schema validation.
    # mcp 1.x's low-level Server did `jsonschema.validate(instance=arguments,
    # schema=tool.inputSchema)` inside its call_tool decorator; mcp 2.0.0's
    # low-level Server does no such validation (mcp/server/validation.py is
    # sampling/elicitation only), so pmcp now does this check itself and
    # must depend on jsonschema directly rather than ride mcp's transitive
    # `Requires-Dist: jsonschema>=4.20.0`, whose floor this matches.
    "jsonschema>=4.20.0,<5.0.0",
    "pydantic>=2.0",
    "pyjwt[crypto]>=2.10.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Repository = "https://github.com/Consiliency/pmcp"
Homepage = "https://github.com/Consiliency/pmcp"
Issues = "https://github.com/Consiliency/pmcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    # Consiliency/pmcp#200: without this the `timeout` ini option below is
    # inert and a stuck await is a 25-minute silent job cancel.
    "pytest-timeout>=2.3",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]
http = [
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "sse-starlette>=1.6.0",
    "prometheus-client>=0.20",
]
all = [
    "pmcp[dev,http]",
]

[project.scripts]
pmcp = "pmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmcp"]
# `_npm_resolve.js` is not a Python file, and the npm identity resolver is
# dead without it -- `NpmResolver` reports UNAVAILABLE and every npm server
# silently falls back to the flag tables. hatchling happens to include it via
# `packages` today; naming it explicitly means a future change to the include
# rules cannot drop it silently. The `install-smoke` CI job proves it survives
# a real wheel install by RESOLVING a package through it.
artifacts = ["src/pmcp/manifest/_npm_resolve.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
# Consiliency/pmcp#200 -- diagnostics for the intermittent runtime hang. Five
# `test (3.x)` jobs in the week to 2026-09-01 stalled and were killed by the
# job's `timeout-minutes: 25`; GitHub reports a timed-out job as *cancelled*,
# so none of them produced a red X, a traceback, or one line of evidence about
# which await was stuck. These two settings turn that into a fast, loud
# failure. They do not fix the hang -- the root cause is still unknown.
#
# Both numbers derive from `pytest tests/ --durations=25` on 2026-09-02 (see
# `.consiliency/evidence/hang-diagnostics-200.md`). The slowest non-`live`
# tests are `test_progressive_disclosure.py::TestScenario8_LibraryConcepts
# ::test_invoke_query_docs_conceptual` at 60.25 s and its Scenario7 sibling at
# 60.22 s. (Both land on almost exactly 60 s, which looks like an internal
# timeout rather than real work -- noted, not in scope here.)
#
#   faulthandler_timeout = 120  -- 2x the slowest test. Zero-risk half: it
#     kills nothing, it dumps every thread's stack and lets the run continue,
#     which is what actually names the stuck await.
#   timeout              = 700  -- >=10x the slowest test (10 x 60.25 = 602.5,
#     so 600 would have been 9.96x and short of the bar). The fail-fast half,
#     via pytest-timeout. The dump therefore lands ~9.7 minutes before the
#     kill, and both sit well inside the `test` job's `timeout-minutes: 25`.
#
# Set here rather than on the CI command line so a local run behaves like CI.
# `timeout_method` is not the platform default by accident: it is the value
# that `tests/runtime/test_hang_diagnostics.py` empirically proves also covers
# *fixture teardown*, which is where the likeliest hang site is -- pytest
# prints `PASSED` when the test function returns, before teardown runs.
faulthandler_timeout = 120
timeout = 700
timeout_method = "signal"
markers = [
    "live: opt-in live integration tests (require network and package managers)",
    "timeout(seconds): expected maximum runtime for slow opt-in tests",
]
filterwarnings = [
    # Suppress coroutine warnings from test mocks
    "ignore:coroutine .* was never awaited:RuntimeWarning",
    # Suppress event loop closed warnings from subprocess cleanup
    "ignore::pytest.PytestUnraisableExceptionWarning:",
]

[tool.mypy]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/pmcp"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 60
show_missing = true
skip_covered = true
