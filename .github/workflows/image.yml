name: Image

# Guarded container image publisher. Every registry write is disabled unless
# the repository variable PMCP_IMAGE_PUBLISH is exactly `enabled`; activation
# is a separate owner step. Only `promote-main` holds packages: write, and it
# writes the immutable sha-<40 hex> tag before moving `main`. The trusted code
# is scripts/image_publish.py at github.workflow_sha (the default-branch
# commit running this file); no pull-request code runs here. Guarded by
# scripts/check_workflows.py image_publication_invariants.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      open: ${{ steps.decide.outputs.open }}
    steps:
      - id: decide
        env:
          PMCP_IMAGE_PUBLISH: ${{ vars.PMCP_IMAGE_PUBLISH }}
        run: |
          python3 -I -B - <<'PY'
          import os
          if os.environb.get(b"PMCP_IMAGE_PUBLISH") == b"enabled":
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("open=yes\n")
          PY

  verify-upstream:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - name: Check out the trusted publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/image_publish.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify the upstream Test run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 -I -B scripts/image_publish.py verify-upstream --run-id "$RUN_ID" --attempt "$RUN_ATTEMPT"

  build-smoke:
    needs: verify-upstream
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      manifest_digest: ${{ steps.inspect.outputs.manifest_digest }}
      config_digest: ${{ steps.inspect.outputs.config_digest }}
    steps:
      - name: Check out the trusted publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/image_publish.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: trusted

      - name: Check out the verified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-upstream.outputs.head_sha }}
          persist-credentials: false
          path: candidate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the OCI archive
        run: docker buildx build --platform linux/amd64 --provenance=false --sbom=false --no-cache --output "type=oci,dest=$RUNNER_TEMP/image.oci.tar" candidate

      - name: Verify the OCI layout
        id: inspect
        run: python3 -I -B trusted/scripts/image_publish.py oci-inspect --archive "$RUNNER_TEMP/image.oci.tar"

      # quay.io/skopeo/stable:v1.22.3-immutable; linux/amd64 manifest sha256:ab4c269c9e2bd11affe2666b860fb651a15afec121c15986b052b02e09d86239
      - name: Load the candidate locally
        run: docker run --rm -v "$RUNNER_TEMP:/work:ro" -v /var/run/docker.sock:/var/run/docker.sock quay.io/skopeo/stable@sha256:c0ee1f4edca5c01cb8d5611124f92f3cc47196ecab68aee5d0f90834e00574d5 --insecure-policy copy oci-archive:/work/image.oci.tar docker-daemon:pmcp-image-smoke:candidate

      - name: Smoke the loaded candidate
        run: python3 -I -B trusted/scripts/image_publish.py smoke --archive "$RUNNER_TEMP/image.oci.tar" --image pmcp-image-smoke:candidate --probe-server candidate/.github/probe/p1_probe_server.py

      - name: Keep the verified archive for promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-oci
          path: ${{ runner.temp }}/image.oci.tar
          retention-days: 1
          if-no-files-found: error

  promote-main:
    needs: [gate, verify-upstream, build-smoke]
    if: ${{ needs.gate.outputs.open == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: pmcp-image-main
      cancel-in-progress: false
    steps:
      - name: Check out the trusted publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts/image_publish.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download this run's verified archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-oci
          path: ${{ runner.temp }}/candidate

      - name: Promote to ghcr.io (sha tag, then main)
        env:
          PMCP_IMAGE_PUBLISH: ${{ vars.PMCP_IMAGE_PUBLISH }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.build-smoke.outputs.manifest_digest }}
          HEAD_SHA: ${{ needs.verify-upstream.outputs.head_sha }}
        run: python3 -I -B scripts/image_publish.py promote --archive "$RUNNER_TEMP/candidate/image.oci.tar" --manifest-digest "$MANIFEST_DIGEST" --head-sha "$HEAD_SHA" --authfile "$RUNNER_TEMP/pmcp-registry-auth.json"

      - name: Remove the registry authfile
        if: always()
        run: rm -f "$RUNNER_TEMP/pmcp-registry-auth.json"
