name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 1.21.0 could have broken with ZERO commits to this repo: mcp 2.0.0 was
  # published after the last CI run and nothing re-ran to notice. Push/PR
  # triggers cannot catch a dependency that moves underneath a released
  # package, so run weekly against the released artifact.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      # The npm identity resolver (Consiliency/pmcp#195) drives the HOST npm's
      # own parser, so the resolver-active half of the identity suite only runs
      # where node and npm exist. Pinned rather than left to the runner image:
      # `bin/npx-cli.js` is byte-identical across npm 10.8.2 .. 11.19.0 and the
      # resolver refuses an `npx-cli.js` it does not recognise, so an image that
      # silently moved to a different npm major would turn that half of the
      # suite from covering production into skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=xml --cov-report=term-missing

      - name: Check coverage threshold
        run: uv run coverage report --fail-under=60

  # Every other job installs via `uv sync`, which uses uv.lock — so they only
  # ever exercise the PINNED dependency versions. That hid a shipped break: an
  # unbounded `mcp>=1.0.0` let a real install resolve to mcp 2.0.0, which had
  # renamed a symbol the gateway imports at startup. The whole suite passed
  # while `pip install pmcp` was dead on arrival.
  #
  # This job resolves dependencies FRESH, exactly as a user does, and smoke-tests
  # the installed console script. It is the only job that can catch a bad or
  # missing version constraint.
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The npm identity resolver (Consiliency/pmcp#195) drives the HOST npm's
      # own parser, so the resolver-active half of the identity suite only runs
      # where node and npm exist. Pinned rather than left to the runner image:
      # `bin/npx-cli.js` is byte-identical across npm 10.8.2 .. 11.19.0 and the
      # resolver refuses an `npx-cli.js` it does not recognise, so an image that
      # silently moved to a different npm major would turn that half of the
      # suite from covering production into skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build and install from the wheel, ignoring uv.lock
        run: |
          uv build --wheel --out-dir dist
          uv venv /tmp/fresh
          # No --frozen / no uv.lock: resolve from pyproject constraints alone.
          VIRTUAL_ENV=/tmp/fresh uv pip install dist/*.whl

      - name: Report the resolved versions (so a bad bump is visible in the log)
        run: VIRTUAL_ENV=/tmp/fresh uv pip list

      - name: Smoke-test the installed entry point
        run: |
          /tmp/fresh/bin/pmcp --version
          # Import the modules a real startup touches, so a renamed or removed
          # upstream symbol fails here rather than in a user's service log.
          /tmp/fresh/bin/python -c "import pmcp.client.manager, pmcp.server, pmcp.config.loader"

      # `_npm_resolve.js` is not a Python file, and npm package identity is dead
      # without it: `NpmResolver` reports UNAVAILABLE and every npm/npx server
      # silently drops back to the flag tables -- the exact fail-open
      # Consiliency/pmcp#195 removed, and invisible in every other job because
      # they all run from the source tree.
      #
      # This step must ACTUALLY RESOLVE a package through the installed helper.
      # Importing the module and asserting nothing would pass with the .js file
      # missing entirely. Note the `cd`: npm's own local-prefix rule means a
      # `package.json` or `node_modules` in any ancestor of the working
      # directory makes the resolver refuse, and the repository checkout is the
      # directory this suite controls.
      - name: The packaged npm resolver must resolve, not just import
        run: |
          cd "$GITHUB_WORKSPACE"
          node --version
          /tmp/fresh/bin/python - <<'PY'
          from pmcp.manifest import npm_resolver

          print("installed helper:", npm_resolver._HELPER)
          assert npm_resolver._HELPER.is_file(), "the wheel did not ship _npm_resolve.js"
          result = npm_resolver.get_resolver().resolve(
              "npx", ["-y", "left-pad"], env={}, cwd=None
          )
          assert result.is_identity and result.spec == "left-pad", result
          print("helper OK:", result.spec)
          PY

  # install-smoke proves the CEILING: the unpinned resolve still works. It says
  # nothing about the FLOOR, because a fresh resolve always picks the newest
  # allowed version. A declared lower bound that was never installed is a guess,
  # and this repo shipped one: `mcp>=1.0.0` while mcp.client.streamable_http —
  # imported by client/manager.py at module scope — first exists in mcp 1.8.0.
  # This job installs pinned at exactly the declared floor and proves it works.
  min-version-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Resolve the declared minimum mcp from pyproject
        id: floor
        run: |
          FLOOR=$(python3 <<'PY'
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'"mcp>=([0-9.]+),<', text)
          assert match, "could not parse the mcp lower bound from pyproject.toml"
          print(match.group(1))
          PY
          )
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
          echo "declared mcp floor: $FLOOR"

      - name: Install at the floor and import the startup modules
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          uv build --wheel --out-dir dist
          uv venv /tmp/floor
          VIRTUAL_ENV=/tmp/floor uv pip install dist/*.whl "mcp==${FLOOR}"
          VIRTUAL_ENV=/tmp/floor uv pip list
          /tmp/floor/bin/pmcp --version
          /tmp/floor/bin/python -c "import pmcp.client.manager, pmcp.server, pmcp.config.loader"

      # Imports are not acceptance for a gateway, and neither is /health —
      # transport/http.py:435-436 returns "ok": True as a hardcoded literal.
      # Only a real downstream tool call exercises session init, discovery,
      # and invocation, which is where an mcp break actually lands.
      - name: Serve a real downstream tool call at the floor
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          VIRTUAL_ENV=/tmp/floor uv pip install "$(ls dist/*.whl)[http]" "mcp==${FLOOR}"
          mkdir -p /tmp/floorhome/lock /tmp/floorhome/xdg
          cp .github/probe/p1_probe_server.py .github/probe/p1_probe_client.py /tmp/floorhome/
          printf '{"mcpServers": {"p1probe": {"command": "/tmp/floor/bin/python", "args": ["/tmp/floorhome/p1_probe_server.py"]}}}\n' > /tmp/floorhome/mcp.json
          printf 'servers:\n  allowlist: ["p1probe"]\n' > /tmp/floorhome/policy.yaml
          HOME=/tmp/floorhome XDG_CONFIG_HOME=/tmp/floorhome/xdg /tmp/floor/bin/pmcp \
            --transport http --host 127.0.0.1 --port 3399 \
            --config /tmp/floorhome/mcp.json \
            --project /tmp/floorhome \
            --policy /tmp/floorhome/policy.yaml \
            --lock-dir /tmp/floorhome/lock -l info > /tmp/floorboot.log 2>&1 &
          PROBE_PID=$!
          trap 'kill "$PROBE_PID" 2>/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:3399/health > /dev/null && break
            sleep 1
          done
          cat /tmp/floorboot.log
          # Assert the RESOLVED set is exactly the one fixture. Do NOT tripwire on
          # "a count in the hundreds" — the shipped manifest always contributes 106,
          # so a correctly isolated run legitimately reports skipped=106 and
          # policy_denied=106. Hundreds in those buckets is the CORRECT output; what
          # proves isolation is that lazy+eager (the denominator here) is exactly 1.
          grep -E 'Gateway initialized: [0-9]+/1 servers online' /tmp/floorboot.log
          /tmp/floor/bin/python /tmp/floorhome/p1_probe_client.py http://127.0.0.1:3399/mcp
          kill "$PROBE_PID" 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  # 2.0.1 and 2.1.0 both merged feature PRs against an empty [Unreleased]
  # block, so the maintainer had to hand-backfill CHANGELOG.md at release
  # time by reconstructing it from git log. This job catches it at PR time
  # instead: a PR that changes anything under src/ (shipped code) must also
  # touch CHANGELOG.md. Runs on pull_request only — push/schedule/
  # workflow_dispatch have no PR base ref to diff against, so the job is a
  # no-op there via the `if:` below.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    # A job-level permissions: block replaces the repo default for every
    # scope, not just the one named — so contents: read has to be repeated
    # here or actions/checkout below loses read access.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout defaults to a shallow (depth-1) clone, which
          # doesn't contain the PR base ref needed for the three-dot diff
          # below. fetch-depth: 0 fetches full history for all branches.
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry for src/ changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Frozen at trigger time -- the fallback below, not the primary source.
          # Passed as env rather than interpolated into the script body so a
          # label's text can never be parsed as shell.
          PAYLOAD_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Query live labels via the API instead of github.event.pull_request.labels.
          # That context is frozen in the event payload at the moment the workflow
          # was triggered (opened/synchronize/reopened); a "Re-run jobs" replays that
          # same frozen payload rather than re-fetching it, so a label applied to an
          # already-running/failed PR would never be seen that way. Reading live here
          # means "apply the label, then re-run the job" actually works.
          # Use the PULLS endpoint, not /issues/<n>/labels: this job grants
          # `pull-requests: read`, and the issues endpoint needs `issues: read`,
          # so it returned "Validation Failed (HTTP 422)". Under `bash -e` that
          # non-zero exit killed the step BEFORE the CHANGELOG check ran, so the
          # guard failed on its own permissions rather than on the PR's content.
          # A lookup FAILURE is not "no label": treating them alike false-blocks
          # a PR that really was labelled (Consiliency/pmcp#156 item 4). On
          # failure, fall back to the frozen event payload -- stale for a label
          # applied after the trigger, but better than ignoring the label.
          # Branch on the EXIT STATUS, never on emptiness. A successful lookup
          # returning zero labels is authoritative -- it means the label was
          # removed. Falling back to the frozen payload there would resurrect a
          # deleted `skip-changelog` and silently bypass this guard, which is
          # worse than the false block the fallback exists to prevent
          # (ah board review).
          if LABELS=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.labels[].name'); then
            echo "Live label lookup succeeded."
          else
            echo "Live label lookup FAILED — falling back to the event payload."
            LABELS=$(printf '%s' "$PAYLOAD_LABELS_JSON" | jq -r '.[]?' 2>/dev/null || true)
          fi
          echo "Current labels: $LABELS"
          if echo "$LABELS" | grep -qx 'skip-changelog'; then
            echo "skip-changelog label present — skipping the CHANGELOG.md check."
            exit 0
          fi

          CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -q '^src/'; then
            echo "No changes under src/ — CHANGELOG.md not required."
            exit 0
          fi

          if echo "$CHANGED" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md was updated."
            exit 0
          fi

          echo "::error::This PR changes files under src/ but does not update CHANGELOG.md. Add an entry under '## [Unreleased]' in CHANGELOG.md, or apply the 'skip-changelog' label and re-run this check if this change ships no user-visible behavior."
          exit 1

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: uv run mypy src/pmcp --exclude baml_client

  # release.yml triggers ONLY on tag push — the tag push IS the publish — so it
  # never appears in PR checks, and every guard that protected #188's change to
  # it was run by hand, once. The nastiest mutant is silent: changing the tag
  # filter "v*" to "V*" leaves a workflow that is still valid, still passes
  # actionlint, and simply never runs at tag push. There is no red X anywhere;
  # a version just sits tagged-but-unshipped. This job runs the structural
  # guards at PR time instead. See scripts/check_workflows.py and
  # .consiliency/evidence/mutation-189.md for what is and is not covered.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A job-level permissions: block replaces the repo default for every scope,
    # not just the one named — so contents: read has to be repeated here or
    # actions/checkout below loses read access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # job_set_drift compares each changed workflow against its BASE
          # revision with a three-dot diff. The default depth-1 clone does not
          # contain the base commit, and check_workflows.py fails CLOSED on a
          # base it cannot resolve — so without this the job goes red rather
          # than silently passing with drift detection disabled.
          fetch-depth: 0

      # check_workflows.py imports yaml, which is NOT on a stock ubuntu-latest
      # image. Without a Python setup the guard dies with ModuleNotFoundError
      # while `uv run` still passes locally — a guard that guards nothing.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          # sha256 of the ARCHIVE, asserted before extraction. This is not the
          # digest of the extracted binary — they are different byte streams
          # (archive 8aca8d…, binary c872d6…). The --version assertion below
          # covers the installed artifact separately.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          cd /tmp
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          test "$(actionlint --version | head -n1)" = "${ACTIONLINT_VERSION}"

      # Run it BARE, with no glob: `actionlint *.yml` leaves a .yaml workflow
      # unchecked (bypass-proofs-187.md §A), and actionlint exits 3 outside a
      # git root. This is schema validation only: it caught 4 of the 37 mutants
      # in mutation-189.md — a dangling `needs:`, two ill-typed timeouts and a
      # literal `if: false` — and none of the ones that leave the workflow both
      # valid and silent. That is why the next step exists.
      - name: Run actionlint
        run: actionlint

      - name: Resolve the drift base
        id: drift-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          # pull_request: the PR's base sha. `github.event.before` is a
          # PushEvent field and is UNSET on pull_request — wiring that here
          # would leave every PR running with an empty base and drift silently
          # skipped, on the one path that gates merges.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # push: the previous tip of the branch. `origin/main` would compare a
          # push to main against itself.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE_SHA" ;;
            push)         BASE="$PUSH_BEFORE" ;;
            # schedule / workflow_dispatch have no base to diff against:
            # invariants run, drift is skipped, and the script says so.
            *)            BASE="" ;;
          esac
          # The all-zero sha is GitHub's sentinel for "no previous commit" (the
          # first push of a branch). That is *no base*, which is not the same
          # as a base that fails to resolve — the checker fails closed on the
          # latter, deliberately, so the sentinel is mapped here instead.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=""
          fi
          echo "drift base for ${EVENT_NAME}: '${BASE}'"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      # No `|| true` and no continue-on-error: this step must be able to fail
      # the job. bypass-proofs-187.md records that fail-open pattern having
      # already happened once on this very check.
      - name: Check workflow invariants and job-set drift
        run: uv run python scripts/check_workflows.py --base-ref "${{ steps.drift-base.outputs.base }}"

  # check_workflows.py is an allowlist: it catches bad states it knows how to
  # name. It cannot catch the mutants nobody has thought of — a workflow-level
  # `concurrency` with cancel-in-progress, an added step, a rewritten awk
  # extraction. This job is the tripwire for that remainder: any PR touching
  # release.yml must carry an explicit acknowledgement label. It covers by
  # ACKNOWLEDGEMENT what an allowlist cannot cover by enumeration, and mirrors
  # the changelog/skip-changelog pattern above.
  release-diff-ack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    # Replaces the repo default for every scope: contents: read is repeated so
    # actions/checkout keeps read access, pull-requests: read is for the live
    # label lookup below.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed for the three-dot diff against the PR base.
          fetch-depth: 0

      - name: Require an acknowledgement label for release.yml changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Frozen at trigger time — the fallback below, not the primary
          # source. Passed as env rather than interpolated into the script body
          # so a label's text can never be parsed as shell.
          PAYLOAD_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          echo "Changed files:"
          echo "$CHANGED"

          if ! echo "$CHANGED" | grep -qx '\.github/workflows/release\.yml'; then
            echo "release.yml is untouched — no acknowledgement required."
            exit 0
          fi

          # Query live labels via the API instead of
          # github.event.pull_request.labels. That context is frozen in the
          # event payload at the moment the workflow was triggered; a "Re-run
          # jobs" replays that same frozen payload rather than re-fetching it,
          # so a label applied to an already-failed PR would never be seen.
          # Reading live here means "apply the label, then re-run" works, which
          # is the whole intended workflow for this job.
          # Use the PULLS endpoint, not /issues/<n>/labels: this job grants
          # `pull-requests: read`, and the issues endpoint needs `issues: read`
          # (it returned HTTP 422 for the changelog job, killing the step under
          # `bash -e` before the check ever ran).
          # Branch on the EXIT STATUS, never on emptiness: a successful lookup
          # returning zero labels is authoritative — it means the label was
          # removed, and falling back to the frozen payload there would
          # resurrect a deleted acknowledgement and bypass this guard.
          if LABELS=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.labels[].name'); then
            echo "Live label lookup succeeded."
          else
            echo "Live label lookup FAILED — falling back to the event payload."
            LABELS=$(printf '%s' "$PAYLOAD_LABELS_JSON" | jq -r '.[]?' 2>/dev/null || true)
          fi
          echo "Current labels: $LABELS"

          if echo "$LABELS" | grep -qx 'release-change-approved'; then
            echo "release-change-approved label present — acknowledged."
            exit 0
          fi

          echo "::error::This PR changes .github/workflows/release.yml, which triggers only on tag push and therefore never appears in PR checks — a mistake in it is invisible until a release breaks. Review the diff, then apply the 'release-change-approved' label and re-run this check."
          exit 1
