name: Published wheel compatibility

on:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Verify Node and npm environment
        run: |
          test "$(node -p "process.versions.node.split('.')[0]")" = 22
          npm_version=$(npm --version)
          case "$npm_version" in
            10.*|11.*) ;;
            *) echo 'Unsupported npm major for identity validation'; exit 1 ;;
          esac
          node --version
          npm --version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
      - name: Check the published wheel with fresh dependencies
        id: published
        env:
          REPORT_PATH: ${{ runner.temp }}/published-wheel/report.json
        run: uv run --no-project --python 3.12 python scripts/check_published_wheel.py --report "$REPORT_PATH"
      - name: Retain public compatibility identity
        if: ${{ always() && steps.published.outputs.report_ready == 'true' && vars.PMCP_CI_DISABLE_REPORTS == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-wheel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published-wheel/report.json
          retention-days: 14
          if-no-files-found: error
