name: Pipeline Bootstrap Setup
description: Install Node 24 and bootstrap-script dependencies for the pipeline-bootstrap workflow

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24

    - name: Install bootstrap-script dependencies
      shell: bash
      run: npm ci --prefix scripts/pipeline-bootstrap
